apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-demo-ingress
spec:
  podSelector:
    matchLabels:
      app: web-demo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: frontend
      ports:
        - protocol: TCP
          port: 8080
